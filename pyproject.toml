[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-cli"
version = "0.1.0"
description = "A command-line weather application"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "rich"
]

[project.scripts]
weather = "weather:main"

[tool.setuptools]
py-modules = ["weather"]
